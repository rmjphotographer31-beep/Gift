<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #5a1a2c;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 500px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.3rem;
      line-height: 1.6;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      background: #ff5c8a;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #e84875;
    }

    #message {
      margin-top: 20px;
      font-size: 1.5rem;
      display: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>I Love You ❤️</h1>
    <p>
      I made this little website just for you because you mean so much to me.
      You make my life better, and I am so lucky to have you.
    </p>

    <button onclick="showMessage()">Click me</button>

    <div id="message">
      Forever and always, you have my heart 💕
    </div>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").style.display = "block";
    }
  </script>
</body>
</html>
